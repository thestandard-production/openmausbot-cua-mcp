[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openmausbot-cua-mcp"
version = "0.2.0"
description = "A local MCP server that connects AI clients to OpenMausBot's bundled cua-driver."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Production Craft" }]
keywords = ["mcp", "openmausbot", "computer-use", "claude", "codex", "minimax"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "cryptography>=42,<49",
  "mcp>=1.20,<2",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
openmausbot-cua-mcp = "openmausbot_cua_mcp.server:main"
omb-ctl = "openmausbot_cua_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/thestandard-production/openmausbot-cua-mcp"
Issues = "https://github.com/thestandard-production/openmausbot-cua-mcp/issues"
Source = "https://github.com/thestandard-production/openmausbot-cua-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/openmausbot_cua_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
